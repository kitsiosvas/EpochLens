[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epochlens"
version = "0.1.0"
description = "First-look figures for labeled EEG: waveforms, scalograms, scalp maps, covariance geometry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kitsiosvas" }]
keywords = ["eeg", "visualization", "figures", "scalogram", "topography"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyriemann>=0.8",
]

[project.optional-dependencies]
explorer = ["streamlit>=1.32", "plotly>=5.18", "matplotlib>=3.7"]
fif = ["mne>=1.6"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "plotly>=5.18", "streamlit>=1.32"]
all = ["streamlit>=1.32", "plotly>=5.18", "matplotlib>=3.7", "mne>=1.6", "pytest>=7.4"]

[project.scripts]
epochlens = "epochlens.explorer.cli:main"
epochlens-explorer = "epochlens.explorer.cli:main"

[project.urls]
Homepage = "https://github.com/kitsiosvas/EpochLens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
