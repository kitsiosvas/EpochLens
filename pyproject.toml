[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegvis"
version = "0.1.0"
description = "Dataset-agnostic EEG visualization: CWT scalograms, discriminability maps, sensor ranking, Riemannian embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "kitsiosvas" }]
keywords = ["eeg", "visualization", "cwt", "riemannian", "inner-speech", "bci"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
explorer = ["streamlit>=1.32", "plotly>=5.18", "matplotlib>=3.7"]
nieto = ["mne>=1.6"]
moabb = ["mne>=1.6", "moabb>=1.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]
all = ["streamlit>=1.32", "plotly>=5.18", "matplotlib>=3.7", "mne>=1.6", "moabb>=1.0", "pytest>=7.4"]

[project.scripts]
eegvis-explorer = "eegvis.explorer.cli:main"

[project.urls]
Upstream = "https://github.com/N-Nieto/Inner_Speech_Dataset"
Dataset = "https://openneuro.org/datasets/ds003626"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
