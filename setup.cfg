[metadata]
name = eegvis
version = 0.1.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    scipy>=1.11
    scikit-learn>=1.3

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    eegvis-explorer = eegvis.explorer.cli:main
